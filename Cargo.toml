[package]
name = "assembly-scanner"
version = "0.1.1"
edition = "2024"
default-run = "assembly-scanner"
description = "Windows EtherNet/IP Class 1 scanner and CSV assembly logger."
license = "MIT"
repository = "https://github.com/votecoffee/EthernetIPWorkbench"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts"] }
ethernetip-connections = "=0.1.1"
ethernetip-core = "=0.1.1"
socket2 = "0.6"
crossbeam-queue = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rumqttc = { version = "=0.25.1", default-features = false }
toml = "0.8"
tokio = { version = "1", features = ["rt", "time"] }
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Console", "Win32_System_Memory", "Win32_System_Threading"] }

[profile.release]
strip = true
